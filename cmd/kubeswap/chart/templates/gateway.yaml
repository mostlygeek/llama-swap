{{- if .Values.gateway.enabled }}
{{- $fullname := include "llama-swap.fullname" . -}}
{{- $gwName := .Values.gateway.gateway.name | default (printf "%s-gateway" $fullname) -}}
{{- $routeName := .Values.gateway.route.name | default $fullname -}}
{{- $parentRefs := .Values.gateway.route.parentRefs | default (list (dict "name" $gwName "namespace" .Release.Namespace)) -}}
{{- if .Values.gateway.gateway.name }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gwName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
spec:
  {{- with .Values.gateway.gateway.className }}
  gatewayClassName: {{ . }}
  {{- end }}
  listeners:
    {{- toYaml .Values.gateway.gateway.listeners | nindent 4 }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $parentRefs | nindent 4 }}
  {{- with .Values.gateway.route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
{{- end }}
