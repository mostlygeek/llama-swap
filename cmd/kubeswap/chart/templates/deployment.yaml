{{- /* replicas must be exactly 1 (float64: Helm 3.19 loads values as
      float64, and a numeric template function must see a matched kind);
      zero/negative/fractional would render an invalid or useless
      Deployment, and >1 would run two head-ends over one set of
      backends. */}}
{{- if ne (.Values.replicas | float64) 1.0 }}
{{- fail "replicas must be 1: never two head-ends per namespace (each one manages the whole namespace's backends)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama-swap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "llama-swap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- /* Restart the head-end when the rendered config changes. The
            pod already hot-reloads via -watch-config, but a failed
            reload only logs a warning and keeps serving the old config;
            the annotation makes drift visible as a rollout. Skipped for
            config.existing — the chart cannot hash a ConfigMap it does
            not render. */}}
      {{- /* deepCopy: merge mutates its first argument, so without a
            copy the generated checksum would be injected into
            .Values.podAnnotations itself; mergeOverwrite then lets the
            generated checksum/config win over any user-supplied value
            (a stale user value would hide config drift) while leaving
            the original values untouched. */}}
      {{- $annotations := deepCopy (.Values.podAnnotations | default dict) }}
      {{- if not .Values.config.existing }}
      {{- $annotations = mergeOverwrite $annotations (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) }}
      {{- end }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "llama-swap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llama-swap.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.gcInitContainer.enabled .Values.initContainers }}
      initContainers:
        {{- if .Values.gcInitContainer.enabled }}
        # One-shot gc per head-end start: deletes backend workloads whose
        # models are no longer in the config.
        - name: kubeswap-gc
          image: {{ include "llama-swap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/kubeswap
            - gc
            - --namespace
            - {{ .Release.Namespace }}
            - --config
            - /etc/llama-swap/config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/llama-swap/config
              readOnly: true
          {{- with .Values.gcInitContainer.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: llama-swap
          image: {{ include "llama-swap.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/usr/local/bin/llama-swap"]
          args:
            - -config
            - /etc/llama-swap/config/config.yaml
            - -watch-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/llama-swap/config
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "llama-swap.configMapName" . }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
