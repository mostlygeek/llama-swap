{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llama-swap.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-swap.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- if not .paths }}
    {{- fail (printf "ingress: host %s has no paths (add paths: [{path: /, pathType: Prefix}])" .host) }}
    {{- end }}
    {{- $host := .host }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- if not .pathType }}
          {{- fail (printf "ingress: path %s on host %s has no pathType (required by networking.k8s.io/v1: Exact, Prefix or ImplementationSpecific)" .path $host) }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "llama-swap.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
