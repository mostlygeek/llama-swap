<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server is off</title>
<style>
:root {
    --bg: #1a1c2c;
    --panel: #262b44;
    --ink: #f4f4f4;
    --dim: #94b0c2;
    --gold: #ffcd75;
    --green: #38b764;
    --red: #b13e53;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    background-color: var(--bg);
    /* faint scanlines */
    background-image: repeating-linear-gradient(
        to bottom, transparent 0, transparent 3px, rgba(0, 0, 0, .18) 3px, rgba(0, 0, 0, .18) 4px);
    color: var(--ink);
    font-family: "Courier New", Courier, monospace;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    image-rendering: pixelated;
}
.box {
    width: 100%;
    max-width: 420px;
    padding: 28px 24px;
    text-align: center;
    background: var(--panel);
    /* notched pixel border */
    box-shadow:
        0 -4px 0 0 var(--ink), 0 4px 0 0 var(--ink),
        -4px 0 0 0 var(--ink), 4px 0 0 0 var(--ink),
        8px 8px 0 0 rgba(0, 0, 0, .45);
}
.sprite { width: 90px; height: 96px; display: block; margin: 0 auto 18px; }
h1 { margin: 0 0 14px; font-size: 22px; color: var(--gold); text-shadow: 3px 3px 0 #000; }
p { margin: 8px 0; font-size: 14px; line-height: 1.6; color: var(--dim); }
form { margin: 0; }
.btn {
    margin-top: 20px;
    padding: 12px 22px;
    font: inherit;
    letter-spacing: inherit;
    text-transform: inherit;
    color: #1a1c2c;
    background: var(--green);
    border: 0;
    cursor: pointer;
    box-shadow:
        0 -4px 0 0 #000, 0 4px 0 0 #000, -4px 0 0 0 #000, 4px 0 0 0 #000,
        inset -4px -4px 0 0 #257953, inset 4px 4px 0 0 #a7f070;
}
.btn:hover { background: #a7f070; }
.btn:focus-visible { outline: 4px dashed var(--gold); outline-offset: 6px; }
.btn:active { transform: translate(4px, 4px); }
.blink { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
    .blink, .bar i, .sprite { animation: none !important; }
}
</style>
</head>
<body>
<main class="box">
    <svg class="sprite" viewBox="0 0 15 16" shape-rendering="crispEdges" aria-hidden="true"><path fill="#1a1c2c" d="M2 0h11v1h-11zM1 1h1v1h-1zM13 1h1v1h-1zM1 2h1v1h-1zM13 2h1v1h-1zM1 3h1v1h-1zM13 3h1v1h-1zM1 4h1v1h-1zM13 4h1v1h-1zM1 5h1v1h-1zM13 5h1v1h-1zM1 6h1v1h-1zM13 6h1v1h-1zM1 7h1v1h-1zM13 7h1v1h-1zM1 8h1v1h-1zM13 8h1v1h-1zM1 9h1v1h-1zM13 9h1v1h-1zM1 10h1v1h-1zM13 10h1v1h-1zM1 11h1v1h-1zM13 11h1v1h-1zM1 12h1v1h-1zM13 12h1v1h-1zM1 13h1v1h-1zM13 13h1v1h-1zM2 14h11v1h-11zM3 15h2v1h-2zM10 15h2v1h-2z"/><path fill="#94b0c2" d="M2 1h11v1h-11zM2 2h1v1h-1zM12 2h1v1h-1zM2 3h1v1h-1zM12 3h1v1h-1zM2 4h1v1h-1zM12 4h1v1h-1zM2 5h1v1h-1zM12 5h1v1h-1zM2 6h1v1h-1zM12 6h1v1h-1zM2 7h1v1h-1zM12 7h1v1h-1zM2 8h1v1h-1zM12 8h1v1h-1zM2 9h1v1h-1zM12 9h1v1h-1zM2 10h1v1h-1zM12 10h1v1h-1zM2 11h1v1h-1zM12 11h1v1h-1zM2 12h1v1h-1zM5 12h8v1h-8zM2 13h11v1h-11z"/><path fill="#566c86" d="M3 2h9v1h-9zM3 5h9v1h-9zM3 8h9v1h-9zM3 11h9v1h-9z"/><path fill="#333c57" d="M3 3h9v1h-9zM3 4h9v1h-9zM3 6h9v1h-9zM3 7h9v1h-9zM3 9h9v1h-9zM3 10h9v1h-9z"/><path fill="#b13e53" d="M3 12h2v1h-2z"/></svg>
    <h1>Server offline</h1>
    <p>The upstream server is asleep.</p>
    <p>Wake it up?</p>
    <form method="post" action="/wol-wake">
        <button class="btn" type="submit">&#9654; Start server</button>
    </form>
</main>
</body>
</html>
