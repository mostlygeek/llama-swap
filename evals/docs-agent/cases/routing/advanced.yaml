- id: routing-queue-capacity
  question: Requests pile up while a model is loading. What should I inspect before adding client retries?
  expect_any: ["queue", "health", "proxy"]
  expect_tools_any: [docs__search_docs, docs__get_doc]
  require_tools: true

- id: routing-matrix-operators
  question: In a matrix set expression, what do ampersand and pipe mean?
  expect_regex: ["&"]
  expect_any: ["both", "and", "\\|", "either"]
  expect_tools_any: [docs__search_docs, docs__get_doc]
  require_tools: true

- id: routing-global-concurrency
  question: How do I cap how many inference requests run at once across all my models combined?
  tags: [routing, limits]
  expect_regex: ["globalConcurrencyLimit"]
  expect_tools: [docs__search_docs]
  reference: |
    Set the top-level `globalConcurrencyLimit`. The default is 0, no limit.
  rubric:
    - Names globalConcurrencyLimit
    - Distinguishes it from the per-model concurrencyLimit
