name: Build Unified Docker Image (variant)

# The build chain for ONE variant: builder base -> one job per upstream
# project -> assemble and push.
#
# unified-docker.yml calls this once per variant so they are fully independent.
# ik_llama.cpp alone takes hours to compile, on every backend. With every
# variant in one job graph, whichever image finished first could not publish
# until the others did too, because `needs` applies to a whole job and not to
# individual matrix cells. Separate calls are the only way GitHub expresses
# per-variant dependencies.

on:
  workflow_call:
    inputs:
      variant:
        description: "cuda, cuda13 or vulkan -- the build-image.sh flag, minus the dashes"
        required: true
        type: string
      platform:
        description: "linux/amd64 or linux/arm64 -- also picks the runner"
        required: true
        type: string
      date_tag:
        description: "Date suffix for the published tags, resolved once by setup"
        required: true
        type: string
      projects:
        description: "JSON array of projects to build for this variant"
        required: true
        type: string
      push_to_ghcr:
        description: "Push the assembled image to ghcr.io"
        required: true
        type: boolean
      llama_hash:
        required: true
        type: string
      whisper_hash:
        required: true
        type: string
      sd_hash:
        required: true
        type: string
      audio_hash:
        required: true
        type: string
      ik_llama_hash:
        required: true
        type: string
      ls_hash:
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Every stage runs natively on a runner of the target architecture. Compiling
# CUDA through QEMU is not practical for builds that already take hours, so the
# platform selects the runner rather than a cross-build. The selection is
# repeated on each job because `runs-on` cannot read the `env` context.

jobs:
  base:
    name: base (${{ inputs.platform }})
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Skipped entirely when base-<backend>.Dockerfile has not changed.
      - name: Build and publish builder base
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          chmod +x docker/unified/build-image.sh
          docker/unified/build-image.sh --${{ inputs.variant }} --stage=base

  artifacts:
    name: build ${{ matrix.project }} (${{ inputs.platform }})
    needs: base
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Each project gets a runner to itself. GitHub's hard cap is 360m; stop
    # short of it so an overrun is reported as a timeout on one project rather
    # than a silent cancellation of the whole build.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Skipped entirely when this project's upstream commit and recipe are
      # both unchanged since a previous run published them.
      - name: Build and publish artifacts
        env:
          PLATFORM: ${{ inputs.platform }}
          LLAMA_REF: ${{ inputs.llama_hash }}
          WHISPER_REF: ${{ inputs.whisper_hash }}
          SD_REF: ${{ inputs.sd_hash }}
          AUDIO_REF: ${{ inputs.audio_hash }}
          IK_LLAMA_REF: ${{ inputs.ik_llama_hash }}
          LS_VERSION: ${{ inputs.ls_hash }}
        run: |
          chmod +x docker/unified/build-image.sh
          docker/unified/build-image.sh --${{ inputs.variant }} --stage=${{ matrix.project }}

  assemble:
    name: assemble (${{ inputs.platform }})
    needs: artifacts
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af
          echo "After cleanup:"
          df -h

      # On GitHub Actions runners, create a fresh builder.
      # When running locally under act, skip this and reuse the existing
      # llama-swap-builder (which has ccache warm) to avoid exhausting disk.
      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd #v4.0.0

      - name: Log in to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 #v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Copies each project's published /install into the runtime image, verifies
      # the binaries, derives the rootless variant, and pushes both under
      # arch-qualified tags. The compile stages are not part of this build's
      # graph, so this is minutes. The date-suffixed and arch-less tags are
      # minted by the manifest job once every platform has landed.
      - name: Assemble and push this platform's image
        env:
          PLATFORM: ${{ inputs.platform }}
          DATE_TAG: ${{ inputs.date_tag }}
          LLAMA_REF: ${{ inputs.llama_hash }}
          WHISPER_REF: ${{ inputs.whisper_hash }}
          SD_REF: ${{ inputs.sd_hash }}
          AUDIO_REF: ${{ inputs.audio_hash }}
          IK_LLAMA_REF: ${{ inputs.ik_llama_hash }}
          LS_VERSION: ${{ inputs.ls_hash }}
          DOCKER_IMAGE_TAG: ghcr.io/mostlygeek/llama-swap:unified-${{ inputs.variant }}
          # When running under act, use the local builder that has warm ccache.
          # On GitHub Actions, BUILDX_BUILDER is unset so docker uses the builder
          # created by setup-buildx-action above.
          BUILDX_BUILDER: ${{ env.ACT == 'true' && 'llama-swap-builder' || '' }}
        run: |
          chmod +x docker/unified/build-image.sh
          PUSH_FLAG=""
          if [[ "${ACT:-}" != "true" && "${{ inputs.push_to_ghcr }}" == "true" ]]; then
            PUSH_FLAG="--push"
          fi
          docker/unified/build-image.sh --${{ inputs.variant }} --assemble ${PUSH_FLAG}
